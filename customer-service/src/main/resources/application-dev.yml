spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=customerdb;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:changeMe123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: true

logging:
  level:
    com.bank.customerservice: DEBUG
    org.hibernate.SQL: DEBUG

# For local dev without a real Entra ID tenant, point this at a local mock
# OIDC issuer, or override with an env var pointing to a dev tenant.
security:
  jwt:
    issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}

azure:
  eventgrid:
    topic-endpoint: ${EVENTGRID_TOPIC_ENDPOINT:https://localhost/fake-topic}
    topic-key: ${EVENTGRID_TOPIC_KEY:local-dev-key}
