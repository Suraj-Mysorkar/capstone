spring.application.name=customer-service

# Optional externalised secrets (same convention as loan-service / document-service).
# Put DB_PASSWORD / JWT_ISSUER_URI / EVENTGRID_* in one of these files to keep
# them out of source control; missing files are ignored.
spring.config.import=optional:file:../secrets.properties,optional:file:secrets.properties,optional:file:../../secrets.properties

# No profile active by default -> the shared Azure SQL config below is used
# (matches loan-service / report-service, which have no profiles at all).
#   SPRING_PROFILES_ACTIVE=dev   -> local SQL Server (application-dev.yml)
#   SPRING_PROFILES_ACTIVE=prod  -> fully env-var driven (application-prod.yml)
#   SPRING_PROFILES_ACTIVE=local -> embedded H2, no infra (application-local.yml)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Shared Azure SQL Database (smzen-capstone-db) — same server/URL shape the
# report-service uses (login + password embedded in the URL as user=<login>@<server>).
# Every value is still env-overridable via DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:sqlserver://smzen-capstone.database.windows.net:1433;database=smzen-capstone-db;user=cs_admin@smzen-capstone;password=Capstone@;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${DB_USERNAME:cs_admin}
spring.datasource.password=${DB_PASSWORD:Capstone@}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

# Schema is owned by Flyway (V1..V3). Hibernate's `validate` is disabled because
# its SQL Server schema lookup does not resolve the shared, mixed-case `Users`
# table reliably; Flyway is the single source of truth. The `local` profile still
# uses ddl-auto=update against embedded H2.
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
# Baseline at 0 so V1 still runs when pointed at an already-populated database
# (the shared DB already holds loan-service / report-service tables).
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8081}
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Microsoft Entra ID tenant issuer, e.g.
# https://login.microsoftonline.com/<tenant-id>/v2.0
security.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}

azure.eventgrid.topic-endpoint=${EVENTGRID_TOPIC_ENDPOINT:https://localhost/fake-topic}
azure.eventgrid.topic-key=${EVENTGRID_TOPIC_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
