spring:
  application:
    name: customer-service

  # Optional externalised secrets (same convention as loan-service / document-service).
  # Put DB_PASSWORD / JWT_ISSUER_URI / EVENTGRID_* in one of these files to keep
  # them out of source control; missing files are ignored.
  config:
    import:
      - "optional:file:../secrets.properties"
      - "optional:file:secrets.properties"
      - "optional:file:../../secrets.properties"

  profiles:
    # No profile active by default -> the shared Azure SQL config below is used
    # (matches loan-service / report-service, which have no profiles at all).
    # SPRING_PROFILES_ACTIVE=dev  -> local SQL Server (application-dev.yml)
    # SPRING_PROFILES_ACTIVE=prod -> fully env-var driven (application-prod.yml)
    active: ${SPRING_PROFILES_ACTIVE:}

  datasource:
    # Shared Azure SQL Database (smzen-capstone-db) — same server the loan-service
    # and report-service connect to. Every value is env-overridable.
    url: ${DB_URL:jdbc:sqlserver://smzen-capstone.database.windows.net:1433;database=smzen-capstone-db;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
    username: ${DB_USERNAME:cs_admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

security:
  jwt:
    # Microsoft Entra ID tenant issuer, e.g.
    # https://login.microsoftonline.com/<tenant-id>/v2.0
    issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}

azure:
  eventgrid:
    topic-endpoint: ${EVENTGRID_TOPIC_ENDPOINT:https://localhost/fake-topic}
    topic-key: ${EVENTGRID_TOPIC_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
