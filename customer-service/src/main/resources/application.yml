spring:
  application:
    name: customer-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

security:
  jwt:
    # Microsoft Entra ID tenant issuer, e.g.
    # https://login.microsoftonline.com/<tenant-id>/v2.0
    issuer-uri: ${JWT_ISSUER_URI}

azure:
  eventgrid:
    topic-endpoint: ${EVENTGRID_TOPIC_ENDPOINT}
    topic-key: ${EVENTGRID_TOPIC_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
