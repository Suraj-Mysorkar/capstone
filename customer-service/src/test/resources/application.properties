# Test overrides.
#
# src/main/resources/application.properties points the service at the shared
# Azure SQL database with Flyway enabled. Spring Boot loads that .properties file
# with higher precedence than this module's src/test/resources/application.yml,
# so the H2 settings there were being ignored and the @SpringBootTest ITs ran
# against the real shared database (non-idempotent, writes test rows to prod).
#
# This file (test-classpath application.properties) shadows the main one and
# forces the ITs onto an in-memory H2 database with Hibernate building the
# schema, matching the intent documented in CustomerApiIT.

spring.datasource.url=jdbc:h2:mem:customerdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

security.jwt.issuer-uri=https://login.microsoftonline.com/test-tenant/v2.0

azure.eventgrid.topic-endpoint=https://localhost/test-topic
azure.eventgrid.topic-key=test-key
