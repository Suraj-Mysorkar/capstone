spring:
  datasource:
    url: jdbc:h2:mem:customerdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

security:
  jwt:
    issuer-uri: https://login.microsoftonline.com/test-tenant/v2.0

azure:
  eventgrid:
    topic-endpoint: https://localhost/test-topic
    topic-key: test-key
