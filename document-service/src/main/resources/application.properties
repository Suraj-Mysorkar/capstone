spring.application.name=document-service
server.port=8082

# Import secrets from optional root/local secrets.properties
spring.config.import=optional:file:../secrets.properties,optional:file:secrets.properties,optional:file:../../secrets.properties

spring.datasource.url=jdbc:h2:mem:documentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Azure Blob Storage Configuration (Container: customer-documents in team6capstoneblobstorage)
azure.enabled=${AZURE_ENABLED:true}
azure.storage.blob.account-name=${AZURE_STORAGE_ACCOUNT_NAME:team6capstoneblobstorage}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:customer-documents}
azure.storage.blob.blob-endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:https://team6capstoneblobstorage.blob.core.windows.net/}
azure.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Azure Event Bus / Service Bus Configuration
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.topic-name=${AZURE_SERVICEBUS_DOC_TOPIC_NAME:document-events-topic}

# Loan Service Integration
loan-service.base-url=${LOAN_SERVICE_BASE_URL:http://localhost:8080/api/v1/loans}