server:
  port: 8080

spring:
  application:
    name: digital-lending-loan-service

  config:
    import:
      - "optional:file:../secrets.properties"
      - "optional:file:secrets.properties"
      - "optional:file:../../secrets.properties"

  datasource:
    url: jdbc:sqlserver://smzen-capstone.database.windows.net:1433;database=smzen-capstone-db;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME:cs_admin}
    password: ${DB_PASSWORD:Capstone@}

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

# SpringDoc OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Azure Integrations & Cloud Flags (Toggle azure.enabled=true once Azure resources are provisioned)
azure:
  enabled: ${AZURE_ENABLED:false} # Set to true to switch from structured mock loggers to real Azure cloud SDKs
  callback-base-url: "${AZURE_CALLBACK_BASE_URL:}" # Required in cloud mode, e.g. https://loan-service.example.com
  storage:
    blob:
      connection-string: "${AZURE_STORAGE_CONNECTION_STRING:}"
      container-name: "${AZURE_STORAGE_CONTAINER_NAME:customer-documents}"
  functions:
    emi-calc:
      url: "${AZURE_FUNCTIONS_BASE_URL:https://team6-lending-functions-gbdnd3ahh0bydkgc.southeastasia-01.azurewebsites.net}/api/v1/calculate-emi"
      key: "${AZURE_FUNCTION_KEY:}"
  durable-functions:
    orchestrator-base-url: "${AZURE_FUNCTIONS_BASE_URL:https://team6-lending-functions-gbdnd3ahh0bydkgc.southeastasia-01.azurewebsites.net}/runtime/webhooks/durabletask"
    function-key: "${AZURE_FUNCTION_KEY:}"
  logic-apps:
    manager-approval-webhook-url: "${AZURE_LOGIC_APPS_WEBHOOK_URL:}"
  servicebus:
    connection-string: "${AZURE_SERVICEBUS_CONNECTION_STRING:}"
    topic-name: "${AZURE_SERVICEBUS_TOPIC_NAME:loan-events-topic}"

