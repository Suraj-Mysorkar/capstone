server:
  port: 8080

spring:
  application:
    name: digital-lending-loan-service

  datasource:
    url: jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

# SpringDoc OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Azure Integrations & Cloud Flags (Toggle azure.enabled=true once Azure resources are provisioned)
azure:
  enabled: false # Set to true to switch from structured mock loggers to real Azure cloud SDKs
  callback-base-url: "" # Required in cloud mode, e.g. https://loan-service.example.com
  storage:
    blob:
      connection-string: "DefaultEndpointsProtocol=https;AccountName=placeholder;AccountKey=placeholder;EndpointSuffix=core.windows.net"
      container-name: loan-documents
  functions:
    emi-calc:
      url: "https://bank-lending-functions.azurewebsites.net/api/v1/calculate-emi"
      key: "placeholder-key"
  durable-functions:
    # Base URL of the Azure Durable Functions HTTP Management API
    # Used for: start orchestration, raise events, query orchestration status
    orchestrator-base-url: "https://bank-lending-functions.azurewebsites.net/runtime/webhooks/durabletask"
    # Azure Function host key (from Function App > App keys in Azure Portal)
    function-key: "placeholder-function-key"
  logic-apps:
    manager-approval-webhook-url: "https://prod-00.eastus.logic.azure.com/workflows/loan-approval/triggers/manual/paths/invoke"
  servicebus:
    connection-string: "Endpoint=sb://bank-lending-servicebus.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=placeholder"
    topic-name: loan-events-topic
